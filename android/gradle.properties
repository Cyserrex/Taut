android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# Kunci penandatanganan sengaja ikut di dalam repositori dan kata sandinya
# terbuka. Gunanya cuma satu: menjaga agar APK versi baru bisa dipasang
# menimpa yang lama. Kunci ini sama sekali bukan bukti keaslian — jangan
# perlakukan sebagai jaminan bahwa APK berasal dari penulis aslinya.
TAUT_STORE_FILE=../keystore/taut.jks
TAUT_STORE_PASSWORD=taut-public
TAUT_KEY_ALIAS=taut
TAUT_KEY_PASSWORD=taut-public
