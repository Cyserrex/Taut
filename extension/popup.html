<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Taut</title>
<style>
  :root { color-scheme: dark; }
  body {
    width: 268px;
    margin: 0;
    padding: 16px;
    background: #0d0d14;
    color: #f4f4f7;
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .head svg { width: 20px; height: 20px; color: #ff2e63; }
  .head b { font-size: 15px; font-weight: 650; }

  .row {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 11px; margin-bottom: 8px;
    border: 1px solid rgba(255,255,255,.1); border-radius: 11px;
    background: rgba(255,255,255,.05);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff2e63; flex: none; }
  .dot.ok { background: #2fd27a; }
  .row span { color: rgba(244,244,247,.72); }

  label { display: block; margin: 14px 0 6px; color: rgba(244,244,247,.5); font-size: 11.5px; }
  .port { display: flex; gap: 7px; }
  input {
    flex: 1; min-width: 0;
    padding: 8px 11px;
    border: 1px solid rgba(255,255,255,.12); border-radius: 9px;
    background: rgba(255,255,255,.05); color: inherit; font: inherit;
  }
  input:focus { outline: 2px solid rgba(255,46,99,.5); outline-offset: -1px; }
  button {
    padding: 8px 14px; border: none; border-radius: 9px;
    background: #ff2e63; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:active { transform: scale(.96); }

  .hint { margin: 12px 0 0; color: rgba(244,244,247,.42); font-size: 11.5px; line-height: 1.55; }
</style>
</head>
<body>

<div class="head">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M9 18V5l10-2v13" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="6.5" cy="18" r="2.8" fill="currentColor"/>
    <circle cx="16.5" cy="16" r="2.8" fill="currentColor"/>
  </svg>
  <b>Taut</b>
</div>

<div class="row">
  <i class="dot" id="serverDot"></i>
  <span id="serverText">Memeriksa server…</span>
</div>

<div class="row">
  <i class="dot" id="tabDot"></i>
  <span id="tabText">Memeriksa tab…</span>
</div>

<!-- Firefox meminta izin situs secara terpisah; Chrome sudah memberikannya
     saat ekstensi dipasang, jadi bagian ini tetap tersembunyi di sana. -->
<div id="grantBox" hidden>
  <label>Izin situs</label>
  <button id="grant" type="button" style="width:100%">Izinkan akses YouTube Music</button>
</div>

<label for="port">Port server</label>
<div class="port">
  <input id="port" type="number" min="1" max="65535" inputmode="numeric">
  <button id="save" type="button">Simpan</button>
</div>

<p class="hint" id="hint">
  Jalankan <code>npm start</code> di folder Taut pada PC ini, lalu scan QR code
  yang muncul di terminal.
</p>

<script src="popup.js"></script>
</body>
</html>
