name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Uji server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Taut sengaja tanpa dependensi, jadi tidak ada langkah install.
      - name: Jalankan uji
        run: npm test

  extension:
    name: Ekstensi Chrome & Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Susun kedua varian
        run: npm run build:ext

      # Validator resmi Mozilla. Kalau ini merah, penandatanganan pasti ditolak,
      # jadi lebih baik ketahuan di sini daripada saat menerbitkan rilis.
      - name: Periksa dengan validator Mozilla
        run: npx --yes web-ext@8 lint --source-dir=dist/firefox --self-hosted

      - name: Bungkus jadi zip
        run: |
          cd dist/chrome && zip -qr ../taut-chrome.zip . && cd ../..
          cd dist/firefox && zip -qr ../taut-firefox.zip . && cd ../..
          ls -la dist

      # Menghasilkan .xpi bertanda tangan yang bisa dipasang permanen di
      # Firefox biasa. Dilewati kalau kredensial AMO belum disetel, supaya
      # fork dan pull request tetap bisa dibangun.
      - name: Tandatangani untuk Firefox
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "Kredensial AMO belum disetel — melewati penandatanganan Firefox."
            echo "Setel secret AMO_API_KEY dan AMO_API_SECRET untuk mengaktifkannya."
            exit 0
          fi
          npx --yes web-ext@8 sign \
            --source-dir=dist/firefox \
            --artifacts-dir=dist \
            --channel=unlisted

      - uses: actions/upload-artifact@v4
        with:
          name: ekstensi
          path: |
            dist/*.zip
            dist/*.xpi
          if-no-files-found: error

  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bangun APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Beri nama sesuai versi
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/taut-v${VERSION}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  release:
    name: Terbitkan Release
    needs: [test, extension, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Susun paket lengkap
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist "taut-$VERSION"
          # build/ wajib ikut: README menyuruh menjalankan `npm run build:ext`,
          # dan tanpa folder ini perintah itu gagal bagi pemakai zip.
          cp -r server extension web test build package.json README.md LICENSE "taut-$VERSION/"
          zip -qr "dist/taut-v${VERSION}.zip" "taut-$VERSION"
          cp artifacts/apk/*.apk dist/
          cp artifacts/ekstensi/*.zip dist/
          # .xpi hanya ada kalau kredensial AMO tersedia.
          cp artifacts/ekstensi/*.xpi dist/ 2>/dev/null || true
          ls -la dist

      - name: Unggah ke Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag bisa didorong sebelum Release-nya dibuat; siapkan kalau belum ada.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "Taut $GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
